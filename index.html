<!DOCTYPE html>
<html lang="lv">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saziņas forma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
  <main class="page">
    <section class="contact-card" aria-labelledby="contact-title">
      <p class="eyebrow">Sazinies ar mums</p>
      <h1 id="contact-title">Apple stila saziņas forma</h1>
      <p class="subtitle">Atstāj ziņu, un atbildēsim 24 stundu laikā.</p>

      <form class="contact-form" action="/submit" method="post" enctype="multipart/form-data" novalidate>
        <div class="field-row">
          <label class="field">
            <span>Vārds</span>
            <input type="text" name="name" placeholder="Tavs vārds" required />
          </label>
          <label class="field">
            <span>E-pasts</span>
            <input type="email" name="email" placeholder="epasts@piemers.lv" required />
          </label>
        </div>

        <label class="field">
          <span>Tēma</span>
          <input type="text" name="subject" placeholder="Par ko vēlies rakstīt?" required />
        </label>

        <label class="field">
          <span>Ziņa</span>
          <textarea name="message" rows="6" placeholder="Ieraksti savu ziņu..." required></textarea>
        </label>

        <label class="field">
          <span>Pielikums</span>
          <input type="file" name="attachment" />
        </label>
        <div class="captcha-wrap" data-site-key="{{RECAPTCHA_SITE_KEY}}">
          <div class="g-recaptcha" data-sitekey="{{RECAPTCHA_SITE_KEY}}"></div>
        </div>

        <button type="submit">Nosūtīt ziņu</button>
      </form>
    </section>
  </main>

  <div class="alert-modal" id="validation-alert" role="alertdialog" aria-modal="true" aria-labelledby="alert-title"
    hidden>
    <div class="alert-card">
      <button class="alert-close" type="button" aria-label="Aizvērt paziņojumu">×</button>
      <img class="angry-dog" src="https://media.giphy.com/media/fqtyYcXoDV0X6ss8Mf/giphy.gif" alt="Nikns suns" />
      <h2 id="alert-title">Grrr! Aizpildi visus laukus pareizi!</h2>
      <p>Pārbaudi visus ievades laukus un mēģini vēlreiz.</p>
    </div>
  </div>

  <script>
    const form = document.querySelector('.contact-form');
    const fields = form.querySelectorAll('input, textarea');
    const alertModal = document.getElementById('validation-alert');
    const closeAlertBtn = alertModal.querySelector('.alert-close');
    const alertTitle = alertModal.querySelector('#alert-title');
    const alertMessage = alertModal.querySelector('p');
    const captchaWrap = form.querySelector('.captcha-wrap');
    const captchaSiteKey = captchaWrap.dataset.siteKey;

    const showAlert = (title, message) => {
      alertTitle.textContent = title;
      alertMessage.textContent = message;
      alertModal.hidden = false;
      document.body.classList.add('modal-open');
    };

    const hideAlert = () => {
      alertModal.hidden = true;
      document.body.classList.remove('modal-open');
    };

    fields.forEach((field) => {
      field.addEventListener('focus', () => {
        field.classList.add('clicked');
      });

      field.addEventListener('blur', () => {
        field.classList.remove('clicked');
      });
    });

    form.addEventListener('submit', (event) => {
      if (!form.checkValidity()) {
        event.preventDefault();
        fields.forEach((field) => {
          if (!field.checkValidity()) {
            field.classList.add('invalid');
          } else {
            field.classList.remove('invalid');
          }
        });

        showAlert('Grrr! Aizpildi visus laukus pareizi!', 'Pārbaudi visus ievades laukus un mēģini vēlreiz.');
        return;
      }

      const captchaResponse = typeof grecaptcha !== 'undefined' ? grecaptcha.getResponse() : '';

      if (!captchaSiteKey || !captchaResponse) {
        event.preventDefault();
        captchaWrap.classList.add('invalid');
        showAlert('Apstiprini, ka neesi robots', 'Atzīmē reCAPTCHA lauku un mēģini vēlreiz.');
        return;
      }

      captchaWrap.classList.remove('invalid');
      hideAlert();
    });

    closeAlertBtn.addEventListener('click', hideAlert);
    alertModal.addEventListener('click', (event) => {
      if (event.target === alertModal) {
        hideAlert();
      }
    });
  </script>
</body>

</html>
